<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Infinite Scroll Gallery</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    >

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>


    <!-- =========================================
         HERO
    ========================================== -->

    <section class="hero">

        <!-- IMAGE HERO -->
        <img
            class="hero-image"
            id="hero-image"
            src="./image/family-cycling.jpg"
            alt="Family cycling outdoors"
        >


        <!-- VIDEO HERO -->
        <video
            class="hero-video"
            id="hero-video"
            muted
            loop
            playsinline
            preload="metadata"
            style="display: none;"
        >
            <source
                src="./video/landing-video.mp4"
                type="video/mp4"
            >
            Your browser does not support the video tag.
        </video>


        <!-- HERO OVERLAY -->
        <div class="hero-overlay"></div>


        <!-- HERO CONTENT -->
        <div class="hero-content">

            <h1 id="hero-title">
                Αναζήτηση Εικόνων
            </h1>


            <p id="hero-description">
                <span id="hero-description-text">
                    Βρες υπέροχες φωτογραφίες υψηλής ανάλυσης
                </span>

                <i
                    id="show-favorites"
                    class="fa-solid fa-heart"
                    title="Δες τα αγαπημένα σου">
                </i>
            </p>


            <!-- SEARCH BOX -->

            <div class="search-box">


                <!-- IMAGE / VIDEO BUTTONS -->

                <div class="media-switcher">


                    <!-- IMAGE -->

                    <button
                        id="image-mode"
                        class="media-option image-option active"
                        type="button"
                    >
                        <i class="fa-solid fa-image"></i>

                        <span>
                            Image
                        </span>
                    </button>


                    <!-- DIVIDER -->

                    <div class="media-divider"></div>


                    <!-- VIDEO -->

                    <button
                        id="video-mode"
                        class="media-option video-option"
                        type="button"
                    >
                        <i class="fa-solid fa-video"></i>

                        <span>
                            Video
                        </span>
                    </button>

                </div>


                <!-- SEARCH INPUT -->

                <input
                    type="text"
                    id="search-input"
                    placeholder="Αναζήτηση εικόνων..."
                    autocomplete="off"
                >


                <!-- SEARCH BUTTON -->

                <button
                    id="search-btn"
                    type="button"
                    aria-label="Αναζήτηση"
                >
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>

            </div>


            <!-- BACK HOME BUTTON -->

            <button
                id="back-home-btn"
                type="button"
                style="display: none;"
            >
                <i class="fa-solid fa-arrow-left"></i>

                Επιστροφή στην Αρχική
            </button>

        </div>

    </section>


    <!-- =========================================
         GALLERY TOOLBAR
    ========================================== -->

    <section class="gallery-toolbar">

        <nav
            class="categories"
            id="categories"
        >


            <!-- NATURE -->

            <button
                class="category-btn active"
                data-category="nature"
                type="button"
            >
                Nature
            </button>


            <!-- ARCHITECTURE -->

            <button
                class="category-btn"
                data-category="architecture"
                type="button"
            >
                Architecture
            </button>


            <!-- PEOPLE -->

            <button
                class="category-btn"
                data-category="people"
                type="button"
            >
                People
            </button>


            <!-- FASHION -->

            <button
                class="category-btn"
                data-category="fashion"
                type="button"
            >
                Fashion
            </button>


            <!-- CARS -->

            <button
                class="category-btn"
                data-category="cars"
                type="button"
            >
                Cars
            </button>


            <!-- TRAVEL -->

            <button
                class="category-btn"
                data-category="travel"
                type="button"
            >
                Travel
            </button>


            <!-- ANIMALS -->

            <button
                class="category-btn"
                data-category="animals"
                type="button"
            >
                Animals
            </button>


            <!-- ART -->

            <button
                class="category-btn"
                data-category="art"
                type="button"
            >
                Art
            </button>

        </nav>

    </section>


    <!-- =========================================
         GALLERY
    ========================================== -->

    <main id="gallery-container"></main>


    <!-- =========================================
         LOADER
    ========================================== -->

    <div
        id="loader"
        style="display: none;"
    >
        <p>
            Φόρτωση...
        </p>
    </div>


    <!-- =========================================
         LIGHTBOX
    ========================================== -->

    <div id="lightbox">

        <span id="close-lightbox">
            &times;
        </span>


        <img
            id="lightbox-img"
            src=""
            alt="Full size image"
        >

    </div>



    <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        aria-label="Αλλαγή θέματος"
    >
        <i class="fa-solid fa-moon"></i>
    </button>



    <script src="main.js"></script>

</body>

</html>
